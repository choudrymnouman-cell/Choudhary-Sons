services:
  - type: web
    name: choudhary-sons-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: CORS_ORIGINS
        value: https://choudrymnouman-cell.github.io/Choudhary-Sons
      - key: DATABASE_URL
        fromDatabase:
          name: choudhary-sons-db
          property: connectionString
    disk:
      name: choudhary-sons-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: choudhary-sons-db
    databaseName: choudhary_sons
    user: choudhary_sons
